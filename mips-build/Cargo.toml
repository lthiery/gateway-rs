# MIPS build wrapper
# Depends on gateway-rs with legacy-proto feature for Rust 1.72.1 compatibility
# Only lists deps that conflict with modern stack and need version overrides

[package]
name = "helium-gateway-mips"
version = "1.3.0"
edition = "2021"

# Exclude from parent workspace (separate Cargo.lock)
[workspace]

[[bin]]
name = "helium_gateway"
path = "src/main.rs"

[dependencies]
gateway-rs = { path = "..", default-features = false, features = ["legacy-proto", "ecc608"] }

# Override conflicting transitive deps from helium-crypto-legacy
# These pins ensure signature 1.x compatibility
ed25519 = "=1.5.3"
ed25519-compact = "=2.0.4"
signature = { version = "1", features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
