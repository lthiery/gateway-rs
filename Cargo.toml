[package]
name = "gateway-rs"
description = "Helium Gateway for LoRa packet forwarders"
version = "1.3.0"
authors = ["Marc Nijdam <marc@helium.com>"]
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "helium_gateway"
path = "src/main.rs"
doc = false

[workspace]
members = ["lorawan"]

[workspace.dependencies]
byteorder = "1"
serde = { version = "1", features = ["rc", "derive"] }
rust_decimal = { version = "1", features = ["serde-with-float"] }
rand = "0.8"
base64 = ">=0.21"
sha2 = "0"
prost = "0"

[dependencies]
clap = { version = "4", default-features = false, features = [
    "derive",
    "help",
    "std",
    "error-context",
] }
bs58 = "0"
semver = "1"
config = { version = "0", default-features = false, features = ["toml"] }
serde = { workspace = true }
serde_json = "1"
serde_urlencoded = "*"
http-serde = "2"
thiserror = "2"
tokio = { version = "1", default-features = false, features = [
    "macros",
    "signal",
    "rt",
    "time",
    "sync",
    "io-std",
] }
tokio-stream = { version = "0", default-features = false }
futures = "*"
rust_decimal = { workspace = true }
triggered = "0.1"
tracing = "0"
tracing-subscriber = { version = "0", default-features = false, features = [
    "smallvec",
    "fmt",
    "std",
] }
tracing-appender = "0"
rand = { workspace = true }
prost = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
angry-purple-tiger = "1"
lorawan = { package = "lorawan", path = "lorawan" }
exponential-backoff = { git = "https://github.com/yoshuawuyts/exponential-backoff", branch = "master" }
semtech-udp = { version = ">=0.12", default-features = false, features = [
    "server",
] }
time = { version = ">=0.3", features = ["std"] }
http = "1"

# Modern proto stack uses tonic 0.14, legacy uses 0.10
# Each tonic version is optional and tied to its respective proto feature
tonic = { version = "0.14", optional = true }
tonic-legacy = { package = "tonic", version = "0.10", optional = true }

# Modern proto stack (pinned to specific commit for reproducible builds)
helium-proto = { git = "https://github.com/helium/proto", rev = "3dbaedf3a39ab79cabd3b80cf7c648bf23d3c3f8", features = ["services"], optional = true }
beacon = { git = "https://github.com/helium/proto", rev = "3dbaedf3a39ab79cabd3b80cf7c648bf23d3c3f8", optional = true }
helium-crypto = { git = "https://github.com/lthiery/helium-crypto-rs", branch = "main", optional = true }

# Legacy proto stack (works with Rust 1.72.1/Cargo 1.72 for mips)
signature = { version = "1", features = ["std"], optional = true }
helium-proto-legacy = { package = "helium-proto", git = "https://github.com/helium/proto", rev = "c828e0399f88ebbd6d13c8de39c25d70b9440f5b", features = ["services"], optional = true }
beacon-legacy = { package = "beacon", git = "https://github.com/helium/proto", rev = "c828e0399f88ebbd6d13c8de39c25d70b9440f5b", optional = true }
helium-crypto-legacy = { package = "helium-crypto", version = ">=0.8.3", optional = true }

[features]
default = ["modern-proto", "ecc608"]
modern-proto = ["helium-proto", "beacon", "helium-crypto", "tonic"]
legacy-proto = [
    "signature",
    "helium-proto-legacy",
    "beacon-legacy",
    "helium-crypto-legacy",
    "tonic-legacy",
]
ecc608 = ["helium-crypto?/ecc608", "helium-crypto-legacy?/ecc608"]
tpm = ["helium-crypto?/tpm", "helium-crypto-legacy?/tpm"]

[dev-dependencies]
time = { version = ">=0.3", features = ["std", "macros"] }


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
#debug = true
#strip = "debuginfo"
strip = "symbols"

[package.metadata.cross.build]
pre-build = ["apt-get install -y protobuf-compiler"]
