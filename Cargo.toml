[package]
name = "gateway-rs"
description = "Helium Gateway for LoRa packet forwarders"
version = "1.3.0"
authors = ["Marc Nijdam <marc@helium.com>"]
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "helium_gateway"
path = "src/main.rs"
doc = false

[workspace]
members = ["lorawan"]

[workspace.dependencies]
byteorder = "1"
serde = { version = "1", features = ["rc", "derive"] }
rust_decimal = { version = "1", features = ["serde-with-float"] }
rand = "0.8"
base64 = ">=0.21"
sha2 = "0"
prost = "0"

[dependencies]
# Pin clap to 4.4.x for Rust 1.72.1 compatibility
clap = { version = "=4.4.6", default-features = false, features = [
    "derive",
    "help",
    "std",
    "error-context",
] }
bs58 = "0"
semver = "1"
# Pin config for Rust 1.72.1 compatibility
config = { version = "=0.13.3", default-features = false, features = ["toml"] }
serde = { workspace = true }
serde_json = "1"
serde_urlencoded = "*"
# thiserror 1.x works on both old and new Rust
thiserror = "1"
tokio = { version = "1", default-features = false, features = [
    "macros",
    "signal",
    "rt",
    "time",
    "sync",
    "io-std",
] }
tokio-stream = { version = "0", default-features = false }
futures = "*"
rust_decimal = { workspace = true }
triggered = "0.1"
tracing = "0"
tracing-subscriber = { version = "0", default-features = false, features = [
    "smallvec",
    "fmt",
    "std",
] }
tracing-appender = "0"
rand = { workspace = true }
prost = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
angry-purple-tiger = "1"
lorawan = { package = "lorawan", path = "lorawan" }
exponential-backoff = { git = "https://github.com/yoshuawuyts/exponential-backoff", branch = "master" }
semtech-udp = { version = ">=0.12", default-features = false, features = [
    "server",
] }
# Pin time to 0.3.35: has Rust 1.80+ type inference fix, MSRV 1.67.0
time = { version = "=0.3.35", features = ["std"] }

# async-trait for trait impls (works on both old and new Rust)
async-trait = "0.1"

# HTTP dependencies - modern uses http 1.x, legacy uses 0.2.x
# These are feature-gated because tonic 0.14 requires http 1.x, tonic 0.10 requires http 0.2.x
http = { version = "1", optional = true }
http-serde = { version = "2", optional = true }
http-legacy = { package = "http", version = "0.2", optional = true }
http-serde-legacy = { package = "http-serde", version = "1", optional = true }

# Modern proto stack (tonic 0.14, requires http 1.x)
tonic = { version = "0.14", optional = true }
helium-proto = { git = "https://github.com/helium/proto", rev = "3dbaedf3a39ab79cabd3b80cf7c648bf23d3c3f8", features = ["services"], optional = true }
beacon = { git = "https://github.com/helium/proto", rev = "3dbaedf3a39ab79cabd3b80cf7c648bf23d3c3f8", optional = true }
helium-crypto = { git = "https://github.com/lthiery/helium-crypto-rs", branch = "main", optional = true }

# Legacy proto stack (tonic 0.10, requires http 0.2.x, works with Rust 1.72.1)
signature = { version = "1", features = ["std"], optional = true }
tonic-legacy = { package = "tonic", version = "0.10", optional = true }
helium-proto-legacy = { package = "helium-proto", git = "https://github.com/helium/proto", rev = "c828e0399f88ebbd6d13c8de39c25d70b9440f5b", features = ["services"], optional = true }
beacon-legacy = { package = "beacon", git = "https://github.com/helium/proto", rev = "c828e0399f88ebbd6d13c8de39c25d70b9440f5b", optional = true }
# Pin helium-crypto to 0.8.3 for Rust 1.72.1 compatibility
helium-crypto-legacy = { package = "helium-crypto", version = "=0.8.3", optional = true }

[features]
default = ["modern-proto", "ecc608"]
modern-proto = ["helium-proto", "beacon", "helium-crypto", "tonic", "http", "http-serde"]
legacy-proto = [
    "signature",
    "helium-proto-legacy",
    "beacon-legacy",
    "helium-crypto-legacy",
    "tonic-legacy",
    "http-legacy",
    "http-serde-legacy",
]
ecc608 = ["helium-crypto?/ecc608", "helium-crypto-legacy?/ecc608"]
tpm = ["helium-crypto?/tpm", "helium-crypto-legacy?/tpm"]

[dev-dependencies]
time = { version = "=0.3.35", features = ["std", "macros"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[package.metadata.cross.build]
pre-build = ["apt-get install -y protobuf-compiler"]
